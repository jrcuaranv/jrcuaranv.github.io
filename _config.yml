title: Jose Cuaran
name: Jose Cuaran
position: Ph.D. Student at University of Illinois Urbana-Champaign
email: jrcuaranv@gmail.com
description: |
  I am a Ph.D. student in Computer Science at the University of Illinois at Urbana-Champaign. I'm advised by Dr. [Girish Chowdhary](https://ece.illinois.edu/about/directory/faculty/girishc) in the Distributed Autonomous Systems Lab ([DASLAB](http://daslab.illinois.edu/)). My research focuses on robot perception and autonomy, with an emphasis on active perception, semantic mapping, 3D reconstruction, and language-guided task planning.
  I develop AI-driven methods that help robots perceive and reason about complex, unstructured environments under occlusion, sensor noise, and uncertainty. My work combines computer vision, machine learning, and robotics, with applications in agricultural robotics and real-world autonomous systems.
  I am interested in building robust perception and planning systems that enable robots to operate effectively in challenging real-world environments.

